name: Deploy storefront (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "packages/tokens/**"
      - ".github/workflows/deploy-storefront-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar tokens de marca (cores/tipografia) no storefront
        run: node packages/tokens/build-css.mjs

      - name: Copiar tokens.css gerado para o storefront
        run: cp packages/tokens/css/tokens.css apps/storefront/tokens/tokens.css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storefront

      - id: deployment
        uses: actions/deploy-pages@v4
