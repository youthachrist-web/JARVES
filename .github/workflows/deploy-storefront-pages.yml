name: Deploy storefront (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "packages/tokens/**"
      - ".github/workflows/deploy-storefront-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Sincronizar tokens de marca (cores/tipografia) no storefront
        run: node packages/tokens/build-css.mjs

      - name: Copiar tokens.css gerado para o storefront
        run: cp packages/tokens/css/tokens.css apps/storefront/tokens/tokens.css

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/storefront

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
