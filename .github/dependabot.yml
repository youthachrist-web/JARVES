version: 2
updates:
  # Mantém os SHAs fixos das GitHub Actions atualizados (ver
  # .github/workflows/*.yml) — pinar sem isso deixaria as actions travadas
  # pra sempre na versão de hoje, incluindo correções de segurança futuras.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
